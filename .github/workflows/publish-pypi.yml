name: Publish release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify tag and package versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(uv run python -c 'import taskq; print(taskq.__version__)')"
          test "$tag_version" = "$package_version"

      - name: Run release-focused tests
        run: >-
          uv run --extra dev --extra http
          python -m pytest
          tests/test_cli_v1.py
          tests/test_scheduler_target_cli.py
          tests/test_contract_0_3_1.py
          -q

      - name: Build distributions
        run: uv build

      - name: Verify installed wheel
        shell: bash
        run: |
          audit_env="$(mktemp -d)"
          uv venv --python 3.12 "$audit_env/venv"
          uv pip install --python "$audit_env/venv/bin/python" dist/*.whl
          "$audit_env/venv/bin/taskq" version -o json
          "$audit_env/venv/bin/taskq" commands -o json

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/outlabs-taskq
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Publish GitHub prerelease
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*
